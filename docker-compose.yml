# Relic Diver online: the game + lobby server, published through a Cloudflare
# Tunnel. Put TUNNEL_TOKEN in .env (see .env.example and docs/ONLINE.md), then:
#   docker compose up -d --build
services:
  relic-diver:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    # Reachable on this PC only (http://localhost:8080); the tunnel handles the internet.
    ports:
      - "127.0.0.1:8080:8080"
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - relic-diver
